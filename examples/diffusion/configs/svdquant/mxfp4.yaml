quant:
  wgts:
    # sfp4_e2m1_all for the 4-bit values
    dtype: sfp4_e2m1_all
    # blocks of 32 FP4 numbers with INT8 scale
    group_shapes:
    - - -1
      - -1
    # Group by blocks of 32 values
    - - 1
      - 32
      - 1
      - 1
      - 1
    scale_dtypes:
    - null
    - sint8
  ipts:
    static: false
    dtype: sfp4_e2m1_all
    group_shapes:
    - - 1
      - 32
      - 1
      - 1
      - 1
    scale_dtypes:
    - sint8
    allow_unsigned: true
  enable_smooth: true
  smooth:
    enable_proj: true
    proj:
      objective: OutputsError
      strategy: GridSearch
      granularity: Layer
      spans:
      - - AbsMax
        - AbsMax
      alpha: 0.5
      beta: -2
      num_grids: 10  # Reduced to 10 for faster quantization
      allow_low_rank: true
  wgts:
    enable_low_rank: true
    low_rank:
      rank: 16       # Reduced from 32
      early_stop: true
      degree: 2
      objective: OutputsError
      num_iters: 50  # Reduced from 100
  calib:
    num_samples: 32  # Reduced for faster quantization